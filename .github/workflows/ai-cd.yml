name: CD (AI Deploy)

# main 에 반영되면 배포한다. develop →(ai-ci · ai-image)→ main 흐름의 마지막 단계.
# BACKEND 리포 cd.yml 과 같은 모양이다 — 다른 점만 적는다.
#   이미지 저장소  Docker Hub → **ECR(z-ai)**, 자격증명은 OIDC 로만
#   대상 인스턴스  tag:Role=spring → **tag:Role=ai**
#   배포 스크립트  /opt/itta/deploy.sh → **/opt/z-ai-worker/deploy.sh**
#
# AI EC2 는 Python + Qdrant 두 컨테이너라 Spring 용 스크립트를 그대로 쓸 수 없다.
# 이 워크플로는 SHA 를 넘기는 것까지만 하고, 컨테이너 교체는 그 스크립트가 한다.

on:
  push:
    branches: [main]
  workflow_dispatch: # 수동 실행 허용 (인프라 준비 중 검증용)

permissions:
  id-token: write # OIDC 토큰 발급 (액세스 키 미저장)
  contents: read

concurrency:
  # 배포는 겹치면 안 된다. 앞 배포를 취소하지 않고 기다린다 —
  # 중간에 끊으면 컨테이너가 반쯤 교체된 상태로 남는다.
  group: ai-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v6

      - name: AWS 인증 (OIDC — 액세스 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Immutable 리포지토리라 같은 태그 재푸시는 실패한다. 재배포(workflow_dispatch)는
      # 정상 동작이므로 이미 있으면 빌드를 건너뛰고 그 이미지를 그대로 배포한다.
      - name: 이미 올라간 커밋인지 확인
        id: exists
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if aws ecr describe-images \
               --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "이 커밋($IMAGE_TAG)의 이미지가 이미 있다 → 빌드 건너뛰고 배포만 한다."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v4

      - name: 이미지 빌드 & 푸시 (커밋 SHA 태그)
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # ALB 없음 → 롤링/드레이닝 불필요. SSM 으로 deploy.sh 호출만 한다(SSH 아님).
      - name: AI EC2 에 배포 (SSM)
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=ai" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "::error::tag:Role=ai 인 실행 중 인스턴스가 없습니다."
            echo "AI EC2 에 Role=ai 태그가 붙어 있는지 확인하세요(인프라 요청 항목)."
            exit 1
          fi
          echo "배포 대상: $INSTANCE_IDS"

          # 인자 규약: $1=커밋 SHA, $2=전체 이미지 URI.
          # BACKEND deploy.sh 는 SHA 만 받지만 ECR 은 레지스트리 호스트가 필요하므로
          # URI 를 함께 넘긴다. 스크립트가 $2 를 무시해도 무해하다.
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids $INSTANCE_IDS \
            --parameters commands="[\"sudo /opt/z-ai-worker/deploy.sh ${{ github.sha }} $IMAGE_URI\"]" \
            --comment "CD AI ${{ github.sha }}" \
            --query "Command.CommandId" --output text)

          echo "SSM Command: $COMMAND_ID"

          FAIL=0
          for id in $INSTANCE_IDS; do
            aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$id" || FAIL=1
            echo "----- $id 결과 -----"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$id" \
              --query "{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}" \
              --output json
          done
          exit $FAIL

      - name: 요약
        if: always()
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          {
            echo "### AI 배포"
            echo ""
            echo "- 이미지: \`$IMAGE\`"
            echo "- 대상: \`tag:Role=ai\` 인스턴스"
            echo "- 스크립트: \`/opt/z-ai-worker/deploy.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"
