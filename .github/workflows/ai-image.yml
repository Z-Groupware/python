name: AI Image

# 컨테이너 이미지 게이트.
#   PR        → 자격증명 없이 `docker build` 만. Dockerfile 이 깨졌는지 여기서 잡는다.
#   develop   → ECR(z-ai) 로 **커밋 SHA 태그**를 올린다. latest 는 쓰지 않는다.
#
# 실제 배포는 ai-cd.yml(main)이 한다. 이 워크플로는 배포하지 않는다.
#
# 자격증명은 GitHub OIDC 로만 얻는다 — 액세스 키를 저장하지 않는다.
# 액션 버전은 BACKEND 리포 cd.yml 과 같은 조합으로 고정한다(같은 OIDC 역할로 검증된 조합).

on:
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened, ready_for_review]

  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PR: 빌드만 확인한다. 시크릿·OIDC 를 쓰지 않으므로 fork PR 에서도 돈다. ──
  build:
    name: Docker build (푸시 없음)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false # PR 코드를 빌드하는 잡 — 러너에 git 자격증명을 남기지 않는다

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 빌드 검증 (레지스트리 전송 없음)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64 # AI EC2 는 x86_64(t3.medium)
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ── develop: ECR 로 올린다. ──
  push-to-ecr:
    name: Build & Push to ECR (커밋 SHA 태그)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 토큰 발급 — 장기 액세스 키 없이 IAM 역할 assume
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: AWS 인증 (OIDC — 액세스 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ECR 리포지토리가 Immutable 이라 같은 태그로 다시 밀면 실패한다.
      # 워크플로 재실행(Re-run)은 같은 커밋에서 도는 정상 동작이므로, 실패가 아니라
      # 건너뛰기로 처리한다 — 재실행이 빨간불이 되면 사람이 빨간불을 무시하게 된다.
      - name: 이미 올라간 커밋인지 확인
        id: exists
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if aws ecr describe-images \
               --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "이 커밋($IMAGE_TAG)의 이미지가 이미 ECR 에 있다 → 빌드·푸시 건너뜀."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v4

      - name: 이미지 빌드 & 푸시
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # 커밋 SHA 단일 태그. 운영에 어떤 이미지가 떠 있는지 태그=커밋으로 1:1 추적된다.
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          # 캐시 export 실패가 푸시를 막지 않도록 ignore-error(기본값 false)
          cache-to: type=gha,mode=max,ignore-error=true

      - name: 요약
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          SKIPPED: ${{ steps.exists.outputs.found }}
        run: |
          {
            echo "### AI 이미지"
            echo ""
            echo "- 이미지: \`$IMAGE\`"
            if [ "$SKIPPED" = "true" ]; then
              echo "- 결과: 이미 존재해 건너뜀(Immutable)"
            else
              echo "- 결과: 푸시 완료"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
